[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant"
version = "0.1.0"
description = "Hebrew-first shopping assistant"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "pytest>=8.0.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  ".venv",
  "__pycache__",
  ".pytest_cache",
  ".code-review-graph",
  "chp_price_scraper.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

